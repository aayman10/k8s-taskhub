apiVersion: batch/v1
kind: CronJob
metadata:
  name: taskhub-maintenance
  namespace: taskhub
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: maintenance
              image: busybox:1.36
              command:
                - sh
                - -c
                - |
                  echo "TaskHub maintenance"
                  date
