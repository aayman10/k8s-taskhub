apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: taskhub-node-agent
  namespace: taskhub
  labels:
    app: taskhub
    component: node-agent
    environment: lab
spec:
  selector:
    matchLabels:
      app: taskhub
      component: node-agent
  template:
    metadata:
      labels:
        app: taskhub
        component: node-agent
        environment: lab
    spec:
      containers:
        - name: node-agent
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              while true; do
                echo "TaskHub node agent is running"
                sleep 30
              done
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
