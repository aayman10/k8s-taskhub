apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskhub-frontend
  namespace: taskhub
  labels:
    app: taskhub
    component: frontend
    environment: lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskhub
      component: frontend
  template:
    metadata:
      labels:
        app: taskhub
        component: frontend
        environment: lab
    spec:
      containers:
        - name: frontend
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: frontend-cache
              mountPath: /var/cache/nginx
          envFrom:
            - configMapRef:
                name: taskhub-config
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          startupProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            failureThreshold: 3

      volumes:
        - name: frontend-cache
          emptyDir: {}
